<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f1e8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="大阪 2026" />
    <meta name="description" content="2026 大阪 Summer Sonic — 可離線閱讀的日本旅行手冊" />
    <link rel="manifest" href="./manifest.json?v=8" />
    <link rel="apple-touch-icon" href="./images/icon-192.png" />
    <link rel="stylesheet" href="./css/styles.css?v=8" />
    <title>2026 大阪 Summer Sonic</title>
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳至主要內容</a>
    <div class="app-shell">
      <header class="topbar">
        <a class="wordmark" href="#today" aria-label="回到 Today">
          <span>大阪<small>OSAKA</small></span><strong>’26</strong>
        </a>
        <div class="trip-meta">
          <span id="trip-progress">9 DAYS</span>
          <span class="offline-pill" id="network-status"><i></i> OFFLINE READY</span>
        </div>
      </header>

      <main id="main-content">
        <section class="view is-active" id="view-today" data-view="today" aria-labelledby="today-heading">
          <div id="today-content"></div>
        </section>

        <section class="view" id="view-trip" data-view="trip" aria-labelledby="trip-heading" hidden>
          <header class="section-heading">
            <p class="eyebrow">THE JOURNEY</p>
            <h1 id="trip-heading">九日，三座城市。</h1>
            <p>Aug 09 — 17, 2026<br />福岡 · 大阪 · 神戶<small class="city-subline">FUKUOKA · OSAKA · KOBE</small></p>
          </header>
          <div class="day-index" id="day-index"></div>
        </section>

        <section class="view" id="view-explore" data-view="explore" aria-labelledby="explore-heading" hidden>
          <header class="section-heading compact-heading">
            <p class="eyebrow">PLACES TO KEEP</p>
            <h1 id="explore-heading">Explore</h1>
            <p>已排進行程，與臨時多出兩小時時的口袋名單。</p>
          </header>
          <div class="filters" id="city-filters" aria-label="城市篩選"></div>
          <div class="filters filters--small" id="category-filters" aria-label="類別篩選"></div>
          <p class="result-count" id="place-count"></p>
          <div class="place-list" id="place-list"></div>
        </section>

        <section class="view" id="view-info" data-view="info" aria-labelledby="info-heading" hidden>
          <header class="section-heading compact-heading">
            <p class="eyebrow">TRAVEL ESSENTIALS</p>
            <h1 id="info-heading">Info</h1>
            <p>班機、住宿與需要立刻找到的資料。</p>
          </header>
          <div id="info-content"></div>
        </section>
      </main>

      <nav class="bottom-nav" aria-label="主要導覽">
        <button class="nav-item is-active" type="button" data-target="today" aria-current="page">
          <span class="nav-symbol" aria-hidden="true">●</span><span>Today</span>
        </button>
        <button class="nav-item" type="button" data-target="trip">
          <span class="nav-symbol" aria-hidden="true">▤</span><span>Trip</span>
        </button>
        <button class="nav-item" type="button" data-target="explore">
          <span class="nav-symbol" aria-hidden="true">◇</span><span>Explore</span>
        </button>
        <button class="nav-item" type="button" data-target="info">
          <span class="nav-symbol" aria-hidden="true">ⓘ</span><span>Info</span>
        </button>
      </nav>
    </div>

    <dialog class="sheet" id="event-dialog" aria-labelledby="event-dialog-title">
      <div class="sheet-inner">
        <button class="round-close" type="button" data-close-dialog aria-label="關閉">×</button>
        <div id="event-detail"></div>
      </div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="./data/trip.js?v=8"></script>
    <script src="./js/app.js?v=8"></script>
  </body>
</html>
